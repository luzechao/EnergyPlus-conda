name: Build and test EnergyPlus conda package

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.target.platform }})
    runs-on: ${{ matrix.target.os }}

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        target:
          - platform: linux-64
            os: ubuntu-22.04
          - platform: osx-arm64
            os: macos-15          # Apple Silicon runner
          - platform: win-64
            os: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test packaging helpers
        run: python recipe/test_prepare.py

      # Install mingw64 gfortran on Windows — the msys64 base install on
      # windows-2022 runners does NOT include gfortran by default.
      - name: Install gfortran (Windows)
        if: matrix.target.platform == 'win-64'
        shell: cmd
        run: C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed mingw-w64-x86_64-gcc-fortran

      # rattler-build-action builds the recipe. We disable its internal
      # upload-artifact step (it uses a hardcoded path that doesn't match our
      # output layout) and do the upload ourselves below.
      - name: Build conda package
        uses: prefix-dev/rattler-build-action@v0.2.36
        with:
          recipe-path: recipe/recipe.yaml
          build-args: >-
            --target-platform ${{ matrix.target.platform }}
            -c conda-forge
            --variant-config conda_build_config.yaml
            --package-format conda:19
          upload-artifact: false
      # Upload the built .conda file as a GitHub Actions artifact so it can
      # be downloaded from the Actions UI for inspection.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: conda-pkg-${{ matrix.target.platform }}
          path: output/${{ matrix.target.platform }}/*.conda
          if-no-files-found: error
