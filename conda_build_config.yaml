# Variant configuration for LOCAL rattler-build renders (pixi run build).
# This file is at the repo root and passed via --variant-config in pixi.toml.
# Compiler packages choose the platform's standard library. Linux's glibc
# floor is set by the recipe's sysroot; macOS's 13.3 floor is set in build.sh.

# No compiler version pin needed: -Wno-dangling-reference and -Wno-restrict
# are injected via CMAKE_CXX_FLAGS in build.sh, which suppresses both GCC 13+
# diagnostics that fire in the bundled fmt v8.0.1 third-party headers.

# Python variant matrix: build one package per Python version.
# Bare "python" in recipe.yaml requirements lets rattler-build inject the
# variant; Python's own run_exports handles the ABI pin automatically.
python:
  - "3.12"
  - "3.13"
